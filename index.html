<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How well do you know me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbf3f0;
        --card: #fffaf8;
        --ink: #5a4147;
        --muted: #8f7780;
        --rule: #f0dcd6;
        --accent: #e8a0a8;
        --accent-soft: #f9e1e5;
        --ok: #3f6a48;
        --ok-bg: #cfe6d4;
        --no: #8a3b33;
        --no-bg: #f5d3d0;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus:not(:focus-visible),
      input:focus:not(:focus-visible) {
        outline: none;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding: 104px 16px 64px;
      }
      #app {
        max-width: 460px;
        margin: 0 auto;
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 0 20px;
        background: var(--paper);
        border-bottom: 1px solid var(--rule);
      }
      .brand {
        font-family: "Fraunces", Georgia, serif;
        font-size: 20px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
      }
      .menu-btn {
        position: relative;
        width: 44px;
        height: 44px;
        padding: 0;
        background: none;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      .menu-btn span {
        position: absolute;
        left: 11px;
        right: 11px;
        height: 1.5px;
        background: var(--ink);
        transition:
          transform 0.4s cubic-bezier(0.7, 0, 0.2, 1),
          opacity 0.2s,
          top 0.4s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .menu-btn span:nth-child(1) {
        top: 17px;
      }
      .menu-btn span:nth-child(2) {
        top: 25px;
      }
      .menu-btn.open span:nth-child(1) {
        top: 21px;
        transform: rotate(45deg);
      }
      .menu-btn.open span:nth-child(2) {
        top: 21px;
        transform: rotate(-45deg);
      }
      .menu-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .menu {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(243, 237, 227, 0.6);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.4s ease,
          visibility 0.4s;
      }
      .menu.open {
        opacity: 1;
        visibility: visible;
      }
      .menu nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
      .menu a {
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(2.2rem, 9vw, 3.6rem);
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
        padding: 4px 12px;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.45s ease,
          transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
          color 0.2s;
        transition-delay: calc(var(--i) * 70ms);
      }
      .menu.open a {
        opacity: 1;
        transform: none;
        transition-delay:
          calc(120ms + var(--i) * 70ms), calc(120ms + var(--i) * 70ms), 0s;
      }
      .menu a:hover {
        color: var(--accent);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .center {
        text-align: center;
        align-items: center;
      }

      .label {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1,
      h2 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        margin: 0;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 22px;
      }
      .sub {
        margin: 0;
        color: var(--muted);
      }
      .note {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .feedback {
        margin: 0;
        min-height: 1.5em;
        color: var(--ink);
        font-size: 15px;
      }
      .err {
        margin: 0;
        color: var(--no);
      }

      label.field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }

      input[type="text"],
      input[readonly] {
        width: 100%;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 10px 12px;
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
      }
      input[readonly] {
        color: var(--muted);
        font-size: 13px;
      }

      .question {
        border-top: 1px solid var(--rule);
        padding-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .qhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .qslot {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .opt input[type="radio"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        margin: 0;
        flex: none;
      }

      /* Question type switch (Multiple choice / Write your answer) */
      .typebar {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 3px;
      }
      .typebar .pill {
        position: absolute;
        top: 3px;
        bottom: 3px;
        left: 3px;
        width: calc(50% - 3px);
        background: var(--accent-soft);
        border-radius: 3px;
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
      }
      .typebar.is-text .pill {
        transform: translateX(100%);
      }
      .typebar button {
        position: relative;
        z-index: 1;
        background: none;
        border: none;
        padding: 8px 6px;
        font-size: 14px;
        color: var(--muted);
        transition: color 0.25s;
      }
      .typebar button.on {
        color: var(--ink);
      }

      button {
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        border-radius: 4px;
        padding: 11px 18px;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s,
          transform 0.15s;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent);
      }
      button.primary:hover {
        background: #d78a93;
        border-color: #d78a93;
      }
      button.primary:active {
        transform: scale(0.97);
      }
      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
      }
      button.ghost:hover {
        border-color: var(--ink);
      }
      button.text {
        background: none;
        border: none;
        padding: 0;
        font-size: 13px;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      button.text:hover {
        color: var(--ink);
      }
      button:disabled {
        cursor: default;
      }

      .bank {
        border-top: 1px solid var(--rule);
        padding-top: 16px;
      }
      .bank-toggle {
        background: none;
        border: none;
        padding: 0 0 12px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bank-toggle:hover {
        color: var(--ink);
      }
      .bank-toggle::after {
        content: "+";
        font-size: 16px;
        line-height: 1;
        display: inline-block;
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .bank.open .bank-toggle::after {
        transform: rotate(45deg);
      }
      .bank-body {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .bank.open .bank-body {
        grid-template-rows: 1fr;
      }
      .bank-inner {
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .bank-inner button.text {
        text-align: left;
        font-size: 14px;
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .bank.open .bank-inner button.text {
        opacity: 1;
        transform: none;
      }
      .bank.open .bank-inner button.text:nth-child(2n) {
        transition-delay: 40ms;
      }
      .bank.open .bank-inner button.text:nth-child(3n) {
        transition-delay: 80ms;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .row > button {
        flex: 1;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hint {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      /* Multiple choice answers */
      .answer {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 12px 40px 12px 14px;
        transition:
          border-color 0.2s,
          background 0.35s,
          color 0.35s,
          transform 0.15s;
      }
      .answer:hover:not(:disabled) {
        border-color: var(--ink);
      }
      .answer:disabled {
        cursor: default;
      }
      .stack .answer {
        animation: rise 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: calc(var(--d, 0) * 70ms);
      }
      .answer.picked {
        animation: pop 0.32s ease;
      }
      .answer.right {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: var(--ok);
        animation: glow 0.7s ease-out;
      }
      .answer.wrong {
        background: var(--no-bg);
        border-color: var(--no);
        color: var(--no);
        animation: shake 0.45s ease;
      }
      .answer.right::after,
      .answer.wrong::after {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
      }
      .answer.right::after {
        content: "\2713";
      }
      .answer.wrong::after {
        content: "\2715";
      }
      .answer.pending {
        border-style: dashed;
        border-color: var(--accent);
        color: var(--muted);
      }

      /* Write your answer */
      .textans {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input.answerbox {
        width: 100%;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 12px 14px;
        outline: none;
        transition:
          border-color 0.25s,
          background 0.35s,
          color 0.35s;
      }
      input.answerbox:focus {
        border-color: var(--accent);
      }
      input.answerbox:disabled {
        opacity: 1;
      }
      input.answerbox.right {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: var(--ok);
        animation: glow 0.7s ease-out;
      }
      input.answerbox.wrong {
        background: var(--no-bg);
        border-color: var(--no);
        color: var(--no);
        animation: shake 0.45s ease;
      }
      input.answerbox.nudge {
        animation: shake 0.45s ease;
      }

      #out {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #out:empty {
        display: none;
      }
      .score {
        font-family: "Fraunces", Georgia, serif;
        font-size: 56px;
        font-weight: 600;
        line-height: 1;
        margin: 8px 0;
      }
      .attempt {
        border-top: 1px solid var(--rule);
        padding-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .attempt-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }
      .missed {
        margin: 4px 0 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }

      /* Motion */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pop {
        0% {
          transform: scale(0.96);
        }
        60% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes glow {
        0% {
          box-shadow: 0 0 0 0 rgba(63, 106, 72, 0.4);
        }
        100% {
          box-shadow: 0 0 0 12px rgba(63, 106, 72, 0);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(3px);
        }
      }
      .enter {
        animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .fade-in {
        animation: fade 0.35s ease both;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Quiz</a>
      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="menu"
      >
        <span></span><span></span>
      </button>
    </header>

    <div class="menu" id="menu" aria-hidden="true">
      <nav>
        <a href="/" style="--i: 0">Make a quiz</a>
        <a href="/socials/" style="--i: 1">Socials</a>
      </nav>
    </div>

    <div id="app"></div>

    <script>
      const menuBtn = document.getElementById("menuBtn");
      const menu = document.getElementById("menu");

      function setMenu(open) {
        menu.classList.toggle("open", open);
        menuBtn.classList.toggle("open", open);
        menuBtn.setAttribute("aria-expanded", String(open));
        menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        menu.setAttribute("aria-hidden", String(!open));
        document.body.style.overflow = open ? "hidden" : "";
      }
      menuBtn.addEventListener("click", () =>
        setMenu(!menu.classList.contains("open")),
      );
      menu.addEventListener("click", (e) => {
        if (e.target === menu) setMenu(false);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setMenu(false);
      });

      const app = document.querySelector("#app");

      function h(tag, attrs = {}, ...kids) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") el.className = v;
          else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
          else if (v !== undefined && v !== null && v !== false)
            el.setAttribute(k, v === true ? "" : v);
        }
        for (const kid of kids.flat()) {
          if (kid === null || kid === undefined || kid === false) continue;
          el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
        }
        return el;
      }

      function dec(str) {
        let s = str.replace(/-/g, "+").replace(/_/g, "/");
        while (s.length % 4) s += "=";
        const bin = atob(s);
        return new TextDecoder().decode(
          Uint8Array.from(bin, (c) => c.charCodeAt(0)),
        );
      }

      // Same rules as lib/grade.js on the server. Used only for links that
      // carry the quiz in the URL (#q=...).
      function norm(s) {
        return String(s == null ? "" : s)
          .normalize("NFKD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, "")
          .replace(/\s+/g, " ")
          .trim();
      }
      function isCorrectLocal(q, choice) {
        if (q.t === "text") {
          const typed = norm(choice);
          return typed !== "" && (q.accepted || []).some((a) => norm(a) === typed);
        }
        return Number(choice) === q.ans;
      }
      function correctAnswerLocal(q) {
        if (q.t === "text") return (q.accepted || [])[0] || "";
        return q.ans;
      }

      const QUESTION_BANK = [
        "What's my comfort food?",
        "Where did we first meet?",
        "What's my go-to song right now?",
        "What's my most embarrassing guilty pleasure?",
        "What's my dream vacation?",
        "What's the first thing I do when I wake up?",
        "What's my biggest pet peeve?",
        "What would I order at a fancy restaurant?",
        "What's my favorite movie?",
        "What's my love language?",
        "What's something I'm secretly afraid of?",
        "What's my ideal weekend?",
        "What was my first impression of you?",
        "What's the best gift I've ever received?",
        "What would I do with a free day?",
      ];

      let bankOpen = false;

      function questionBank() {
        const wrap = h("div", { class: "bank" + (bankOpen ? " open" : "") });
        const toggle = h(
          "button",
          {
            class: "bank-toggle",
            type: "button",
            "aria-expanded": String(bankOpen),
            onclick: () => {
              bankOpen = !bankOpen;
              wrap.classList.toggle("open", bankOpen);
              toggle.setAttribute("aria-expanded", String(bankOpen));
              toggle.textContent = bankOpen
                ? "Hide question ideas"
                : "Show question ideas";
            },
          },
          bankOpen ? "Hide question ideas" : "Show question ideas",
        );
        const list = h(
          "div",
          { class: "bank-inner" },
          ...QUESTION_BANK.map((text) =>
            h(
              "button",
              {
                class: "text",
                type: "button",
                onclick: () => {
                  draft.qs.push(newQuestion("mc", text));
                  renderBuilder();
                },
              },
              text,
            ),
          ),
        );
        wrap.append(toggle, h("div", { class: "bank-body" }, list));
        return wrap;
      }

      function newQuestion(t = "mc", q = "") {
        return {
          t,
          q,
          opts: ["", ""],
          ans: 0,
          accepted: [""],
        };
      }

      let draft = { name: "", email: "", qs: [newQuestion()] };

      function renderBuilder() {
        app.replaceChildren(
          h(
            "div",
            { class: "card" },
            h("p", { class: "label" }, "Make a quiz"),
            h("h1", {}, "How well do they know you?"),
            h(
              "p",
              { class: "sub" },
              "Write a few questions about yourself, then send them the link. Pick multiple choice, or let them write the answer.",
            ),
            h(
              "label",
              { class: "field" },
              "Your name",
              h("input", {
                type: "text",
                value: draft.name,
                placeholder: "Your name",
                oninput: (e) => (draft.name = e.target.value),
              }),
            ),
            h(
              "label",
              { class: "field" },
              "Your email (optional, for updates when someone finishes)",
              h("input", {
                type: "text",
                value: draft.email,
                placeholder: "you@example.com",
                oninput: (e) => (draft.email = e.target.value),
              }),
            ),
            ...draft.qs.map((qq, i) => questionEditor(qq, i)),
            h(
              "div",
              { class: "row" },
              h(
                "button",
                {
                  class: "ghost",
                  onclick: () => {
                    draft.qs.push(newQuestion());
                    renderBuilder();
                  },
                },
                "Add question",
              ),
              h("button", { class: "primary", onclick: makeLink }, "Get link"),
            ),
            questionBank(),
            h("div", { id: "out" }),
          ),
        );
      }

      function questionEditor(qq, i) {
        const slot = h("div", { class: "qslot" });
        const refill = () =>
          slot.replaceChildren(
            qq.t === "text" ? textEditor(qq, refill) : mcEditor(qq, i),
          );
        refill();

        return h(
          "div",
          { class: "question" },
          h(
            "div",
            { class: "qhead" },
            h("span", {}, `Question ${i + 1}`),
            draft.qs.length > 1
              ? h(
                  "button",
                  {
                    class: "text",
                    onclick: () => {
                      draft.qs.splice(i, 1);
                      renderBuilder();
                    },
                  },
                  "Remove",
                )
              : null,
          ),
          typeSwitch(qq, refill),
          h("input", {
            type: "text",
            value: qq.q,
            placeholder: "Question",
            oninput: (e) => (qq.q = e.target.value),
          }),
          slot,
        );
      }

      // Sliding switch between the two question types. Updates in place so
      // the pill can animate instead of the whole card re-rendering.
      function typeSwitch(qq, refill) {
        const bar = h("div", { class: "typebar" + (qq.t === "text" ? " is-text" : "") });
        const mcBtn = h(
          "button",
          {
            type: "button",
            class: qq.t === "text" ? "" : "on",
            onclick: () => setType("mc"),
          },
          "Multiple choice",
        );
        const textBtn = h(
          "button",
          {
            type: "button",
            class: qq.t === "text" ? "on" : "",
            onclick: () => setType("text"),
          },
          "Write your answer",
        );
        function setType(t) {
          if (qq.t === t) return;
          qq.t = t;
          bar.classList.toggle("is-text", t === "text");
          mcBtn.classList.toggle("on", t === "mc");
          textBtn.classList.toggle("on", t === "text");
          refill();
        }
        bar.append(h("span", { class: "pill" }), mcBtn, textBtn);
        return bar;
      }

      function mcEditor(qq, i) {
        return h(
          "div",
          { class: "qslot" },
          ...qq.opts.map((o, j) =>
            h(
              "div",
              { class: "opt" },
              h("input", {
                type: "radio",
                name: "ans" + i,
                checked: qq.ans === j,
                title: "Correct answer",
                onchange: () => (qq.ans = j),
              }),
              h("input", {
                type: "text",
                value: o,
                placeholder: "Answer " + (j + 1),
                oninput: (e) => (qq.opts[j] = e.target.value),
              }),
              qq.opts.length > 2
                ? h(
                    "button",
                    {
                      class: "text",
                      title: "Remove answer",
                      onclick: () => {
                        qq.opts.splice(j, 1);
                        if (qq.ans === j) qq.ans = 0;
                        else if (qq.ans > j) qq.ans--;
                        renderBuilder();
                      },
                    },
                    "Remove",
                  )
                : null,
            ),
          ),
          h(
            "div",
            { class: "row" },
            qq.opts.length < 4
              ? h(
                  "button",
                  {
                    class: "text",
                    onclick: () => {
                      qq.opts.push("");
                      renderBuilder();
                    },
                  },
                  "Add answer",
                )
              : null,
            h(
              "span",
              { class: "note" },
              "Select the circle next to the correct answer.",
            ),
          ),
        );
      }

      function textAnswerFields(qq, refill) {
        return h(
          "div",
          { class: "qslot" },
          ...qq.accepted.map((a, j) =>
            h(
              "div",
              { class: "opt" },
              h("input", {
                type: "text",
                value: a,
                placeholder:
                  j === 0 ? "Answer" : "Also correct (optional)",
                oninput: (e) => (qq.accepted[j] = e.target.value),
              }),
              j > 0
                ? h(
                    "button",
                    {
                      class: "text",
                      title: "Remove answer",
                      onclick: () => {
                        qq.accepted.splice(j, 1);
                        refill();
                      },
                    },
                    "Remove",
                  )
                : null,
            ),
          ),
          h(
            "div",
            { class: "row" },
            qq.accepted.length < 6
              ? h(
                  "button",
                  {
                    class: "text",
                    onclick: () => {
                      qq.accepted.push("");
                      refill();
                    },
                  },
                  "Add another answer",
                )
              : null,
            h(
              "span",
              { class: "note" },
              "Capitals, spaces and punctuation don't matter.",
            ),
          ),
        );
      }

      // Write-your-answer editor: the correct answer and any others that count.
      function textEditor(qq, refill) {
        return h("div", { class: "qslot" }, textAnswerFields(qq, refill));
      }

      async function makeLink() {
        const qs = draft.qs
          .map((qq) => {
            const q = qq.q.trim();
            if (qq.t === "text") {
              const accepted = qq.accepted.map((s) => s.trim()).filter(Boolean);
              return { t: "text", q, accepted: qq.open ? [] : accepted, open: !!qq.open };
            }
            const opts = qq.opts.map((o) => o.trim()).filter(Boolean);
            const correct = (qq.opts[qq.ans] || "").trim();
            let ans = opts.indexOf(correct);
            if (ans < 0) ans = 0;
            return { t: "mc", q, opts, ans };
          })
          .filter((x) =>
            x.t === "text"
              ? x.q && (x.open || x.accepted.length >= 1)
              : x.q && x.opts.length >= 2,
          );

        const out = document.querySelector("#out");

        // Say exactly what is missing. Completely empty question slots are ignored.
        const problems = [];
        if (!draft.name.trim()) problems.push("Add your name.");
        draft.qs.forEach((qq, i) => {
          const filled =
            qq.t === "text"
              ? qq.accepted.filter((s) => s.trim())
              : qq.opts.filter((o) => o.trim());
          if (!qq.q.trim() && !filled.length) return;
          const n = i + 1;
          if (!qq.q.trim()) problems.push(`Question ${n} needs question text.`);
          if (qq.t === "text") {
            if (!qq.open && !filled.length)
              problems.push(`Question ${n} needs a correct answer.`);
          } else if (filled.length < 2) {
            problems.push(`Question ${n} needs at least two answers.`);
          }
        });

        if (problems.length || !qs.length) {
          out.replaceChildren(
            h(
              "p",
              { class: "err" },
              problems.join(" ") || "Add at least one complete question.",
            ),
          );
          return;
        }

        out.replaceChildren(h("p", { class: "note" }, "Creating your link..."));
        try {
          const res = await fetch("/api/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              n: draft.name.trim(),
              email: draft.email.trim(),
              qs,
            }),
          });
          const data = await res.json();
          if (!res.ok)
            throw new Error(data.error || "Could not create the quiz.");

          const link = `${location.origin}/q/${data.id}`;
          const input = h("input", {
            readonly: true,
            value: link,
            onclick: (e) => e.target.select(),
          });
          const copyBtn = h(
            "button",
            {
              class: "primary",
              onclick: () => {
                const done = () => (copyBtn.textContent = "Copied");
                if (navigator.clipboard)
                  navigator.clipboard
                    .writeText(link)
                    .then(done)
                    .catch(() => {
                      input.select();
                      document.execCommand("copy");
                      done();
                    });
                else {
                  input.select();
                  document.execCommand("copy");
                  done();
                }
              },
            },
            "Copy link",
          );

          out.replaceChildren(
            h(
              "p",
              { class: "note" },
              "Send this to them. It works on any device.",
            ),
            input,
            h(
              "div",
              { class: "row" },
              copyBtn,
              h(
                "a",
                {
                  class: "ghost",
                  href: `/q/${data.id}`,
                  style:
                    "display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:11px 18px;font-size:15px;flex:1",
                },
                "Open",
              ),
            ),
          );
          const ownerLink = `${location.origin}/r/${data.id}#key=${data.key}`;
          out.append(
            h(
              "p",
              { class: "note" },
              "Your private results page. Keep this link. It's the only way to see scores.",
            ),
            h("input", {
              readonly: true,
              value: ownerLink,
              onclick: (e) => e.target.select(),
            }),
          );
        } catch (err) {
          out.replaceChildren(h("p", { class: "err" }, err.message));
        }
      }

      let quiz = null,
        idx = 0,
        score = 0,
        answers = [],
        takerName = "";

      // Returns { correct, answer }. For multiple choice, answer is the
      // correct option index. For write-your-answer, it is the correct text.
      async function checkAnswer(qi, choice) {
        if (quiz.local) {
          const q = quiz.qs[qi];
          if (q.open) return { open: true };
          return {
            correct: isCorrectLocal(q, choice),
            answer: correctAnswerLocal(q),
          };
        }
        const res = await fetch("/api/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: quiz.id, qi, choice }),
        });
        if (!res.ok) throw new Error("Could not check that answer. Try again.");
        return res.json();
      }

      function renderIntro() {
        app.replaceChildren(
          h(
            "div",
            { class: "card center enter" },
            h("p", { class: "label" }, "A quiz for you"),
            h("h1", {}, `${quiz.n} made you a quiz`),
            h(
              "p",
              { class: "sub" },
              `${quiz.qs.length} questions. No pressure.`,
            ),
            h(
              "label",
              { class: "field" },
              "Your name (optional)",
              h("input", {
                type: "text",
                value: takerName,
                placeholder: "Your name",
                oninput: (e) => (takerName = e.target.value),
              }),
            ),
            h(
              "button",
              {
                class: "primary",
                onclick: () => {
                  idx = 0;
                  score = 0;
                  answers = [];
                  renderQ();
                },
              },
              "Start",
            ),
            h(
              "button",
              { class: "text", onclick: () => (location.href = "/") },
              "Make your own quiz",
            ),
          ),
        );
      }

      function shake(el) {
        el.classList.remove("nudge");
        void el.offsetWidth;
        el.classList.add("nudge");
      }

      function renderQ() {
        const qq = quiz.qs[idx];
        const fb = h("p", { class: "feedback" });
        const nextSlot = h("div", {});

        function showNext() {
          nextSlot.append(
            h(
              "button",
              { class: "primary enter", onclick: next },
              idx + 1 < quiz.qs.length ? "Next" : "See results",
            ),
          );
        }

        function finish(r, typed) {
          if (r.correct) {
            score++;
            fb.textContent = "Correct. You know them well.";
          } else {
            fb.textContent =
              qq.t === "text"
                ? `Not quite. It was "${r.answer}". It's fine.`
                : "Not quite. It's fine.";
          }
          fb.classList.add("fade-in");
          showNext();
        }

        // Multiple choice
        function mcBody() {
          let picked = null;
          let btns = [];

          async function pick(j) {
            if (picked !== null) return;
            picked = j;
            answers[idx] = j;
            btns.forEach((b) => (b.disabled = true));
            btns[j].classList.add("pending", "picked");
            fb.textContent = "Checking...";
            try {
              const r = await checkAnswer(idx, j);
              btns[j].classList.remove("pending");
              if (r.correct) {
                btns[j].classList.add("right");
              } else {
                btns[j].classList.add("wrong");
                btns[r.answer].classList.add("right");
              }
              finish(r);
            } catch (err) {
              picked = null;
              btns.forEach((b) => {
                b.disabled = false;
                b.classList.remove("pending", "picked");
              });
              fb.textContent = err.message;
            }
          }

          btns = qq.opts.map((o, j) => {
            const b = h("button", { class: "answer", onclick: () => pick(j) }, o);
            b.style.setProperty("--d", j);
            return b;
          });
          return h("div", { class: "stack" }, ...btns);
        }

        // Write your answer
        function textBody() {
          let done = false;
          const input = h("input", {
            type: "text",
            class: "answerbox",
            placeholder: "Type your answer",
            autocomplete: "off",
            onkeydown: (e) => {
              if (e.key === "Enter") submit();
            },
          });
          const submitBtn = h(
            "button",
            { class: "primary", onclick: submit },
            "Check",
          );

          async function submit() {
            if (done) return;
            const typed = input.value.trim();
            if (!typed) {
              fb.textContent = "Type something first.";
              shake(input);
              return;
            }
            done = true;
            input.disabled = true;
            submitBtn.disabled = true;
            fb.textContent = "Checking...";
            try {
              const r = await checkAnswer(idx, typed);
              answers[idx] = typed;
              submitBtn.remove();
              if (r.open) {
                fb.textContent = "Saved. Thanks for answering!";
                fb.classList.add("fade-in");
                showNext();
              } else {
                input.classList.add(r.correct ? "right" : "wrong");
                finish(r);
              }
            } catch (err) {
              done = false;
              input.disabled = false;
              submitBtn.disabled = false;
              fb.textContent = err.message;
            }
          }

          return h("div", { class: "textans" }, input, submitBtn);
        }

        app.replaceChildren(
          h(
            "div",
            { class: "card enter" },
            h(
              "p",
              { class: "label" },
              `Question ${idx + 1} of ${quiz.qs.length}`,
            ),
            h("h2", {}, qq.q),
            qq.t === "text" ? textBody() : mcBody(),
            fb,
            nextSlot,
          ),
        );
      }

      function next() {
        idx++;
        if (idx >= quiz.qs.length) renderResults();
        else renderQ();
      }

      function renderResults() {
        const total = quiz.qs.filter((q) => !q.open).length;
        const r = total ? score / total : 1;
        const msg =
          !total
            ? "Thanks for answering!"
            : r === 1
            ? "A perfect score. They really know you."
            : r >= 0.6
              ? "Pretty close. A few things to learn."
              : "Time for more conversations.";
        const status = h(
          "p",
          { class: "note" },
          quiz.id ? "Sending your score..." : "",
        );
        app.replaceChildren(
          h(
            "div",
            { class: "card center enter" },
            h("p", { class: "label" }, "Results"),
            h("div", { class: "score" }, total ? `${score} / ${total}` : "✓"),
            h("p", { class: "sub" }, msg),
            status,
            h(
              "button",
              {
                class: "primary",
                onclick: () => {
                  idx = 0;
                  score = 0;
                  answers = [];
                  renderQ();
                },
              },
              "Try again",
            ),
            h(
              "button",
              { class: "text", onclick: () => (location.href = "/") },
              "Make your own quiz",
            ),
          ),
        );
        if (quiz.id) {
          fetch("/api/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: quiz.id,
              name: takerName.trim(),
              answers,
            }),
          })
            .then((res) => {
              if (!res.ok) throw new Error();
              status.textContent = "Your score was sent.";
            })
            .catch(() => {
              status.textContent = "Could not send your score.";
            });
        }
      }

      function renderError() {
        app.replaceChildren(
          h(
            "div",
            { class: "card center" },
            h("p", { class: "label" }, "Error"),
            h("h1", {}, "This link is broken"),
            h("p", { class: "sub" }, "Ask them to send it again."),
            h(
              "button",
              { class: "primary", onclick: () => (location.href = "/") },
              "Make your own quiz",
            ),
          ),
        );
      }

      async function loadRemote(id) {
        app.replaceChildren(
          h(
            "div",
            { class: "card center" },
            h("p", { class: "label" }, "Loading..."),
          ),
        );
        try {
          const res = await fetch(`/api/quiz?id=${encodeURIComponent(id)}`);
          if (!res.ok) throw new Error("not found");
          const data = await res.json();
          quiz = { n: data.n, qs: data.qs, id, local: false };
          renderIntro();
        } catch (e) {
          renderError();
        }
      }

      async function loadResults(id) {
        const key =
          (location.hash.match(/key=([A-Za-z0-9_-]+)/) || [])[1] || "";
        app.replaceChildren(
          h(
            "div",
            { class: "card center" },
            h("p", { class: "label" }, "Loading..."),
          ),
        );
        let data;
        try {
          const res = await fetch(
            `/api/results?id=${encodeURIComponent(id)}&key=${encodeURIComponent(key)}`,
          );
          data = await res.json();
          if (!res.ok) throw new Error(data.error || "Could not load results.");
        } catch (e) {
          app.replaceChildren(
            h(
              "div",
              { class: "card" },
              h("p", { class: "label" }, "Results"),
              h("h1", {}, "Can't open these results"),
              h("p", { class: "sub" }, e.message),
            ),
          );
          return;
        }
        renderResultsPage(data);
      }

      function renderResultsPage(data) {
        const attempts = data.attempts;

        // Count how many people missed each question, most missed first.
        const missCounts = data.qs.map(() => 0);
        attempts.forEach((a) =>
          a.missed.forEach((qi) => (missCounts[qi] = (missCounts[qi] || 0) + 1)),
        );
        const ranked = data.qs
          .map((q, qi) => ({ qi, q, n: missCounts[qi] }))
          .filter((x) => !x.q.open)
          .sort((a, b) => b.n - a.n);
        const summary = attempts.length
          ? h(
              "div",
              { class: "attempt" },
              h("strong", {}, "Most missed"),
              ...ranked.map(({ qi, q, n }) =>
                h(
                  "p",
                  { class: "note" },
                  `Question ${qi + 1}: missed by ${n} of ${attempts.length}`,
                ),
              ),
            )
          : null;

        const list = attempts.length
          ? attempts.map((a) => {
              const missed = a.missed.map((qi) => {
                const q = data.qs[qi];
                const answer = q.t === "text" ? (q.accepted || [])[0] : q.opts[q.ans];
                return h(
                  "li",
                  {},
                  `Question ${qi + 1}: ${q.q}`,
                  h("span", { class: "note" }, ` Answer: ${answer}`),
                );
              });
              const typed = Object.entries(a.texts || {}).map(([qi, t]) =>
                h(
                  "li",
                  {},
                  `Question ${Number(qi) + 1}: ${data.qs[Number(qi)].q} `,
                  h("span", { class: "note" }, `→ ${t}`),
                ),
              );
              return h(
                "div",
                { class: "attempt" },
                h(
                  "div",
                  { class: "attempt-head" },
                  h("strong", {}, a.name || "Anonymous"),
                  h("span", {}, `${a.score} / ${a.total}`),
                ),
                h("p", { class: "note" }, new Date(a.at).toLocaleString()),
                missed.length
                  ? h("ul", { class: "missed" }, ...missed)
                  : h("p", { class: "note" }, "Got every question right."),
                typed.length ? h("ul", { class: "missed" }, ...typed) : null,
              );
            })
          : [h("p", { class: "sub" }, "No one has taken it yet.")];

        app.replaceChildren(
          h(
            "div",
            { class: "card enter" },
            h("p", { class: "label" }, "Your results"),
            h("h1", {}, `${data.n}'s quiz`),
            h(
              "p",
              { class: "sub" },
              `${attempts.length} attempt${attempts.length === 1 ? "" : "s"} · ${data.qs.length} questions`,
            ),
            summary,
            ...list,
          ),
        );
      }

      function route() {
        const m = location.pathname.match(/^\/q\/([A-Za-z0-9_-]+)\/?$/);
        if (m) return loadRemote(m[1]);
        const r = location.pathname.match(/^\/r\/([A-Za-z0-9_-]+)\/?$/);
        if (r) return loadResults(r[1]);

        if (location.hash.startsWith("#q=")) {
          try {
            const data = JSON.parse(dec(location.hash.slice(3)));
            const qs = (data.qs || [])
              .filter((q) => q && q.q)
              .map((q) => ({ ...q, t: q.t || "mc" }))
              .filter((q) =>
                q.t === "text"
                  ? Array.isArray(q.accepted) && q.accepted.length >= 1
                  : Array.isArray(q.opts) && q.opts.length >= 2,
              );
            if (!qs.length) throw new Error("empty");
            quiz = { n: String(data.n || "Someone"), qs, local: true };
            return renderIntro();
          } catch (e) {
            return renderError();
          }
        }

        renderBuilder();
      }

      route();
    </script>
  </body>
</html>
